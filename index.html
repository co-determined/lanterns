<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lanterns</title>
<meta name="description" content="Swipe through the lanterns as they rise. A small, warm game that knows what time it is.">
<style>
  :root{--ink:#f6ead2;--gold:#ffd28a;--s:min(1vw,1vh)}
  html,body{margin:0;height:100%;background:#0b1026;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  canvas{display:block;width:100vw;height:100vh;height:100dvh;cursor:crosshair}
  .layer{position:fixed;inset:0;pointer-events:none}
  #hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;transition:opacity 2.5s,transform 2.5s}
  #score{font-size:clamp(22px,4.2vmin,46px);letter-spacing:.12em;font-weight:500;text-shadow:0 0 18px rgba(255,200,120,.35)}
  #misses{display:flex;justify-content:center;gap:6px;margin-top:4px;height:8px}
  #misses i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.85;box-shadow:0 0 6px rgba(255,210,138,.8);transition:opacity .4s,transform .4s}
  #misses i.out{opacity:.15;box-shadow:none;transform:scale(.7)}
  .pill{position:fixed;top:max(10px,env(safe-area-inset-top));font-size:clamp(12px,1.9vmin,16px);padding:8px 12px;border-radius:999px;background:rgba(10,14,40,.55);border:1px solid rgba(255,220,160,.18);color:var(--ink);pointer-events:auto;cursor:pointer;backdrop-filter:blur(8px);transition:opacity 1.5s;letter-spacing:.03em}
  .pill:active{transform:scale(.97)}
  #mood{left:max(10px,env(safe-area-inset-left))}
  #mute{right:max(10px,env(safe-area-inset-right));width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px}
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .card{pointer-events:auto;background:rgba(10,14,40,.80);backdrop-filter:blur(12px);border-radius:22px;padding:clamp(18px,3vmin,30px) clamp(18px,3vmin,28px);max-width:360px;width:86vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,220,160,.15);animation:in .35s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  h1{font-weight:600;letter-spacing:.1em;margin:0 0 6px;font-size:clamp(22px,4vmin,30px)}
  h2{font-weight:500;letter-spacing:.06em;margin:0 0 10px;font-size:clamp(17px,2.6vmin,22px)}
  p{margin:6px 0 16px;opacity:.82;line-height:1.45;font-size:clamp(14px,2vmin,16px)}
  .modes{display:grid;gap:9px}
  button{pointer-events:auto;font:inherit;font-size:clamp(14px,2.1vmin,16px);padding:12px 14px;border-radius:14px;border:1px solid rgba(255,220,160,.25);background:rgba(255,200,120,.10);color:#ffe9c4;cursor:pointer;transition:transform .08s,background .2s}
  button:active{transform:scale(.97)}
  button.primary{background:linear-gradient(180deg,#ffb457,#e8843a);color:#2a1400;border:none;font-weight:600}
  button.quiet{background:transparent;border-color:rgba(255,220,160,.14);opacity:.8}
  .sub{font-size:clamp(11px,1.6vmin,12px);opacity:.6;display:block;margin-top:2px}
  .faces{display:flex;justify-content:space-between;margin:10px 0 4px}
  .faces button{font-size:26px;padding:8px 10px;border-radius:50%}
  .stats{display:flex;justify-content:center;gap:22px;margin:4px 0 14px;font-size:clamp(13px,2vmin,15px);opacity:.85}
  .stats b{display:block;font-size:clamp(20px,3.4vmin,28px);font-weight:600;letter-spacing:.05em}
  .hidden{display:none!important}
  #title{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity 1.6s}
  #title div{text-align:center;padding:4vmin 8vmin;border-radius:50%;background:radial-gradient(ellipse at center,rgba(6,8,24,.55) 0%,rgba(6,8,24,.25) 55%,rgba(6,8,24,0) 72%)}
  #title h1{font-size:clamp(34px,8vmin,72px);letter-spacing:.24em;margin:0;text-shadow:0 0 30px rgba(255,190,110,.45)}
  #title p{font-size:clamp(14px,2.4vmin,20px);letter-spacing:.06em;opacity:.85}
  #cg-banner{display:none;position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;width:min(728px,calc(100vw - 16px));height:90px}
  @media (max-height:560px){#cg-banner{width:min(320px,calc(100vw - 16px));height:50px}}
  #toast{position:fixed;left:0;right:0;bottom:12%;text-align:center;font-size:clamp(14px,2.4vmin,20px);letter-spacing:.06em;opacity:0;transition:opacity .8s;pointer-events:none;text-shadow:0 0 12px rgba(0,0,0,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><div><h1>LANTERNS</h1><p>swipe through them as they rise</p></div></div>
<div id="hud"><div id="score">0</div><div id="misses"></div></div>
<button class="pill" id="mood" aria-label="Change mood">🌙 before bed</button>
<button class="pill" id="mute" aria-label="Sound">🔊</button>
<div id="toast"></div>
<div id="ui">
  <div class="card hidden" id="picker">
    <h2>What are you in the mood for?</h2>
    <div class="modes">
      <button data-mode="bed">Before bed<span class="sub">slow and warm — it ends on its own</span></button>
      <button data-mode="slump">Afternoon slump<span class="sub">three bright minutes</span></button>
      <button data-mode="calm">Calming down<span class="sub">paced to a slow breath</span></button>
      <button data-mode="play">Just play<span class="sub">endless — leaving is free, come back any time</span></button>
      <button class="quiet" id="pickClose">back</button>
    </div>
  </div>
  <div class="card hidden" id="end">
    <h1 id="endTitle">All lit.</h1>
    <p id="endText"></p>
    <div class="stats" id="endStats"><div><b id="stScore">0</b>score</div><div><b id="stLit">0</b>lit</div><div><b id="stBest">0</b>best</div></div>
    <div id="feelWrap"><p style="margin-bottom:2px">How do you feel right now?</p>
      <div class="faces"><button data-f="1">😩</button><button data-f="2">😕</button><button data-f="3">😐</button><button data-f="4">🙂</button><button data-f="5">😌</button></div></div>
    <div class="modes" style="margin-top:10px">
      <button class="primary" id="again">Play again</button>
      <button class="quiet" id="changeMood">Change mood</button>
    </div>
  </div>
</div>
<div id="cg-banner"></div>
<script>
// Lanterns v1.0 — a small warm game that knows what time it is.
// Built 2026-09-13 by Claude for the Syntonia household studio (MycoChat LLC).
// Swipe through rising lanterns to light them; lit lanterns gather into a sky that stays. The mood you pick
// (or the hour picks for you) tunes the whole session: before bed it slows, warms, and ends on its own.
// Nothing leaves the device: the one-tap "how do you feel" is localStorage only.
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas=$('c'), ctx=canvas.getContext('2d');
const hud=$('hud'), scoreEl=$('score'), missesEl=$('misses'), moodBtn=$('mood'), muteBtn=$('mute'), toast=$('toast');
const picker=$('picker'), endCard=$('end'), titleEl=$('title');
const QA=Object.fromEntries(new URLSearchParams(location.search));
if(QA.seed){ let z=(+QA.seed||1)>>>0; Math.random=()=>{ z=(z+0x6D2B79F5)|0; let t=Math.imul(z^(z>>>15),1|z); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const lerp=(a,b,k)=>a+(b-a)*k, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
const store={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

// ---------- CrazyGames SDK: optional everywhere, never blocks the game ----------
const CG = {
  ok:false, env:'none', lastAd:0, // lastAd=0 means 'session start': the first ad can't come sooner than the spacing
  load(){ return new Promise(res=>{ if(QA.nosdk) return res(false); const s=document.createElement('script'); s.src='https://sdk.crazygames.com/crazygames-sdk-v3.js'; s.async=true; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); }); },
  // Runs in the background: the game starts without it and picks the SDK up whenever init resolves (never on disabled domains).
  async init(){ try{ const loaded=await this.load(); if(!loaded||!window.CrazyGames||!CrazyGames.SDK) return; await CrazyGames.SDK.init(); this.env=CrazyGames.SDK.environment; this.ok=(this.env==='crazygames'||this.env==='local');
      this.call(s=>{ s.game.loadingStart(); s.game.loadingStop(); }); this.call(s=>{ if(s.game.addSettingsChangeListener) s.game.addSettingsChangeListener(()=>audio.apply()); }); audio.apply(); if(running) this.gameplayStart(); }catch(e){ this.ok=false; } },
  call(fn){ if(!this.ok) return; try{ fn(CrazyGames.SDK); }catch(e){} },
  gameplayStart(){ this.call(s=>s.game.gameplayStart()); },
  gameplayStop(){ this.call(s=>s.game.gameplayStop()); },
  happytime(){ this.call(s=>s.game.happytime()); },
  loadingStart(){ this.call(s=>s.game.loadingStart()); },
  loadingStop(){ this.call(s=>s.game.loadingStop()); },
  muted(){ try{ return !!(this.ok && CrazyGames.SDK.game.settings && CrazyGames.SDK.game.settings.muteAudio); }catch(e){ return false; } },
  // A midgame ad only at a real break, only in the arcade moods, never more than every 3 minutes, never on the first round.
  adBreak(done){ const now=performance.now()/1000;
    if(!this.ok || !cfg.ads || rounds<2 || now-this.lastAd<185){ done(); return; } // rounds is already incremented: never on the first round
    this.lastAd=now; let finished=false; const fin=()=>{ if(finished) return; finished=true; audio.duck(false); done(); };
    try{ CrazyGames.SDK.ad.requestAd('midgame',{ adStarted:()=>audio.duck(true), adFinished:fin, adError:fin }); setTimeout(fin, 45000); }catch(e){ fin(); } },
  banner(show){ const el=$('cg-banner'); el.style.display=(show&&this.ok)?'block':'none'; if(!this.ok) return; try{ const p = show? CrazyGames.SDK.banner.requestResponsiveBanner('cg-banner') : CrazyGames.SDK.banner.clearAllBanners(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} },
};

// ---------- moods: the vitamin lives here, off the label ----------
// conc = how many unlit lanterns share the sky at start/end (what the player feels; rate alone crowds the calm part).
// speed = rise speed multiplier start/end · pitch = chime base Hz start/end · fail = misses before the round ends (0 = never).
const MODES = {
  bed:  {label:'🌙 before bed',   len:480, conc:[6,3], gap:[0.55,1.6], speed:[1.0,0.55], warm:1, bright:0, scoreFade:1, pitch:[660,330], fail:0, ads:0, breathe:0, feel:1, shake:0,
         endTitle:'All lit.',            endText:"That's the whole sky for tonight."},
  calm: {label:'🌿 calming down',  len:300, conc:[4,3], gap:[0.9,1.3],  speed:[0.7,0.6],  warm:1, bright:0, scoreFade:1, pitch:[600,420], fail:0, ads:0, breathe:1, feel:1, shake:0,
         endTitle:'Steadier.',           endText:'The lanterns rose at the pace of a slow breath. So did you.'},
  slump:{label:'☀️ afternoon slump',len:180, conc:[5,9], gap:[0.5,0.24], speed:[0.9,1.55], warm:0, bright:1, scoreFade:0, pitch:[520,820], fail:5, ads:1, breathe:0, feel:0, shake:1,
         endTitle:'Up you get.',         endText:"Three minutes. That's enough."},
  play: {label:'✨ just play',      len:0,   conc:[5,9], gap:[0.55,0.26],speed:[1.0,1.6],  warm:0, bright:0, scoreFade:0, pitch:[600,600], fail:5, ads:1, breathe:0, feel:0, shake:1,
         endTitle:'The sky went dark.',  endText:'Five drifted away. The ones you lit stay up there for the next round.'},
};
function moodForHour(h){ if(h>=21||h<4) return 'bed'; if(h>=13&&h<=16) return 'slump'; return 'play'; }

// ---------- state ----------
let W=0,H=0,DPR=1,S=1; // S = min(W,H), the unit everything scales by
let mode='bed', cfg=MODES.bed, running=false, paused=false, t0=0, elapsed=0, lastT=0;
let score=0, lit=0, missed=0, streak=0, bestStreak=0, taps=0, strokes=0, rounds=0, ended=false, over=false;
let lanterns=[], sky=[], sparks=[], floats=[], stars=[], hills=[], spawnAcc=9, moon={x:0.78,y:0.18};
let stroke=null; // {pts:[{x,y,t}], lit:[], down:true}
let titleFading=false;
let best = +(store.get('lanterns.best')||0); let happy=false, finishTimer=0, raf=0, idleRaf=0;
let ghost = {on:false, t:0, x:0, y:0, want:!store.get('lanterns.seen')}; // onboarding stroke: fires through the first lantern that gets reachable

// ---------- sizing: read the real laid-out size, re-check every frame ----------
function resize(){ const r=canvas.getBoundingClientRect(); const w=Math.max(1,Math.round(r.width||innerWidth)), h=Math.max(1,Math.round(r.height||innerHeight));
  DPR=Math.max(1,Math.min(window.devicePixelRatio||1,2)); if(w===W&&h===H&&canvas.width===Math.round(w*DPR)) return false;
  W=w;H=h;S=Math.min(W,H); canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); makeStars(); makeHills(); return true; }
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,120));
if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(canvas); if(window.visualViewport) visualViewport.addEventListener('resize',resize);

// ---------- audio: chimes, a very quiet drone, nothing sudden ----------
const audio = {
  AC:null, master:null, drone:null, on:(store.get('lanterns.mute')!=='1'), ducked:false,
  ensure(){ if(!this.AC){ try{ this.AC=new (window.AudioContext||window.webkitAudioContext)(); this.master=this.AC.createGain(); this.master.connect(this.AC.destination); this.apply(); }catch(e){ this.AC=null; } } if(this.AC&&this.AC.state==='suspended') this.AC.resume(); if(this.AC&&!this.drone) this.startDrone(); },
  vol(){ return (this.on && !this.ducked && !CG.muted()) ? 1 : 0; },
  apply(){ if(!this.master) return; const t=this.AC.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setTargetAtTime(this.vol(), t, 0.15); },
  duck(d){ this.ducked=d; this.apply(); },
  toggle(){ this.on=!this.on; store.set('lanterns.mute', this.on?'0':'1'); muteBtn.textContent=this.on?'🔊':'🔇'; this.ensure(); this.apply(); },
  startDrone(){ const AC=this.AC; const g=AC.createGain(); g.gain.value=0.0; g.connect(this.master); const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420; f.connect(g);
    const o1=AC.createOscillator(), o2=AC.createOscillator(); o1.type='sine'; o2.type='triangle'; o1.frequency.value=110; o2.frequency.value=164.8; const g2=AC.createGain(); g2.gain.value=0.35; o1.connect(f); o2.connect(g2); g2.connect(f); o1.start(); o2.start();
    const lfo=AC.createOscillator(), lg=AC.createGain(); lfo.frequency.value=0.1; lg.gain.value=0.0; lfo.connect(lg); lg.connect(g.gain); lfo.start();
    this.drone={g,o1,o2,lfo:lg,f}; g.gain.setTargetAtTime(0.028, AC.currentTime, 2); },
  tuneDrone(p){ if(!this.drone) return; const d=this.drone, t=this.AC.currentTime; const base = cfg.warm? lerp(110,82,p) : (cfg.bright? lerp(110,130,p):110);
    d.o1.frequency.setTargetAtTime(base,t,0.5); d.o2.frequency.setTargetAtTime(base*1.498,t,0.5); d.f.frequency.setTargetAtTime(cfg.warm? lerp(420,260,p):420,t,0.5);
    d.lfo.gain.setTargetAtTime(cfg.breathe?0.018:0, t, 0.5); },
  chime(freq,gain=0.09,dur=0.9){ if(!this.AC) return; const AC=this.AC,t=AC.currentTime; const o=AC.createOscillator(),g=AC.createGain(),o2=AC.createOscillator(),g2=AC.createGain();
    o.type='sine';o.frequency.value=freq;o2.type='sine';o2.frequency.value=freq*2.01;g2.gain.value=0.22; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(this.master);o.start(t);o2.start(t);o.stop(t+dur);o2.stop(t+dur); },
  thud(){ if(!this.AC||!cfg.fail) return; const AC=this.AC,t=AC.currentTime; const o=AC.createOscillator(),g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(60,t+0.25);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3); o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.32); },
};
const PENTA=[0,2,4,7,9,12,14,16];
function comboChime(n,kind){ const p=progress(); let base=lerp(cfg.pitch[0],cfg.pitch[1],p); if(kind==='wish') base*=1.5; if(kind==='moon') base*=0.5;
  const semis=PENTA[Math.min(n-1,PENTA.length-1)]; const f=base*Math.pow(2,semis/12); const gain=cfg.warm? lerp(0.09,0.04,p):0.09; audio.chime(f, gain, cfg.warm? lerp(0.9,1.7,p):0.75); }

// ---------- world ----------
function makeStars(){ if(stars.length) return; const n=Math.round(70+W*H/14000); for(let i=0;i<n;i++) stars.push({u:Math.random(),v:Math.random()*0.85,r:Math.random()*1.3+0.4,tw:Math.random()*6.28,sp:0.4+Math.random()*1.2}); }
function makeHills(){ if(hills.length) return; for(let L=0;L<2;L++){ const pts=[]; const n=24; const base=L?0.905:0.865; const amp=L?0.035:0.055; let ph=Math.random()*10;
  for(let i=0;i<=n;i++){ const x=i/n; const y=base - amp*(0.55*Math.sin(x*7.3+ph)+0.3*Math.sin(x*15.1+ph*1.7)+0.15*Math.sin(x*31+ph*3)); pts.push([x,y]); } hills.push(pts); } }
function progress(){ if(!cfg.len) return clamp(elapsed/240,0,1); return clamp(elapsed/cfg.len,0,1); }
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,k){ const pa=typeof a==='string'?hex(a):a, pb=typeof b==='string'?hex(b):b; return [Math.round(lerp(pa[0],pb[0],k)),Math.round(lerp(pa[1],pb[1],k)),Math.round(lerp(pa[2],pb[2],k))]; }
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function palette(p){ // night blue -> a real amber middle -> deep ember (warm moods); night -> brighter dawn (slump); static (play)
  if(cfg.warm){ const top = p<0.55? mixc('#0b1026','#43213f',p/0.55) : mixc('#43213f','#2a0d12',(p-0.55)/0.45);
    const bot = p<0.55? mixc('#1a1f4a','#8a4420',p/0.55) : mixc('#8a4420','#4a1408',(p-0.55)/0.45); return {top,bot,glow: p<0.5?[255,196,110]:[255,158,88], star:lerp(0.9,0.25,p)}; }
  if(cfg.bright){ return {top:mixc('#0b1026','#1d3a6e',p), bot:mixc('#1a1f4a','#3f7fb0',p), glow:[255,214,140], star:lerp(0.9,0.5,p)}; }
  return {top:hex('#0b1026'), bot:hex('#1a1f4a'), glow:[255,196,110], star:0.9};
}
function spawn(){ const p=progress(); const r=S*rnd(0.040,0.058); const sp=lerp(cfg.speed[0],cfg.speed[1],p);
  const kindR=Math.random(); const kind = kindR<0.07?'wish' : kindR<0.11?'moon' : 'paper';
  const rr = kind==='moon'? r*1.7 : r; const x=rr+Math.random()*Math.max(1,W-2*rr);
  const vy=-(H*rnd(0.075,0.115))*sp*(kind==='moon'?0.6:1);
  const L={x,y:H+rr+10,r:rr,vy,sway:rnd(0.4,1.2)*(Math.random()<0.5?-1:1),ph:Math.random()*6.28,lit:false,age:0,kind,flick:Math.random()*6.28,gone:false,settled:false};
  lanterns.push(L);
  if(kind==='paper' && Math.random()<0.16){ // a tethered pair: light both in one stroke for a bonus
    const dx=rr*2.6*(x<W/2?1:-1); const M={...L, x:clamp(x+dx,rr,W-rr), ph:L.ph+1.2, sway:L.sway, pair:L}; L.pair=M; lanterns.push(M); }
}
function light(L, n){ // n = how many this stroke has lit so far, including this one
  L.lit=true; L.litAt=elapsed; lit++; const mult = L.kind==='wish'?5 : L.kind==='moon'?3 : 1; let pts=10*mult*n;
  let pairBonus=false; if(L.pair && L.pair.lit && stroke && stroke.lit.includes(L.pair)){ pts+=20; pairBonus=true; }
  score+=pts; comboChime(n, L.kind);
  const c=L.kind==='wish'?[150,200,255]:palette(progress()).glow; const k = L.kind==='moon'?26:14;
  for(let i=0;i<k;i++) sparks.push({x:L.x,y:L.y,vx:rnd(-1,1)*S*0.18,vy:rnd(-1.1,0.2)*S*0.18,life:rnd(0.6,1.2),age:0,r:(1+Math.random()*2.5)*(S/500),c});
  if(n>1||mult>1||pairBonus){ const label = pairBonus? 'pair!' : L.kind==='wish'? 'wish ×5' : L.kind==='moon'? 'moon ×3' : `×${n}`; floats.push({x:L.x,y:L.y-L.r,t:0,txt:`+${pts} ${label}`,c}); }
  else if(n===1 && !cfg.scoreFade) floats.push({x:L.x,y:L.y-L.r,t:0,txt:`+${pts}`,c});
  if(cfg.shake && n>=3) shake=Math.min(6,shake+2);
}

// ---------- boot: land in gameplay, the hour picks the mood, the title fades over the first lanterns ----------

  render:()=>{ resize(); draw(progress()); return +progress().toFixed(3); },
  showcase:(sec=200,n=14)=>{ // a pretty frame for screenshots: lit sky + a few rising lanterns + a stroke mid-air
    resize(); ghost.on=false; window.__lanterns.sim(sec); for(let i=0;i<n;i++){ spawn(); const L=lanterns[lanterns.length-1]; if(L.pair){ L.pair.pair=null; L.pair=null; } L.y=rnd(H*0.25,H*0.8); if(i%2) { light(L,1); } } if(QA.title) floats=[]; window.__lanterns.frame(0.2); return window.__lanterns.state(); },
};
})();
</script>
